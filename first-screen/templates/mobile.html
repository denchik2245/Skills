<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Бренд — первый экран, мобильная версия</title>
<!-- Тот же шрифт и те же начертания, что в desktop.html -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&display=swap&subset=cyrillic" rel="stylesheet">
<style>
  :root {
    /* Скопируй :root из desktop.html */
    --accent: #1f6feb;
    --bg: #f6f5f2;
    --text: #121417;
    --text-2: #5b616b;
    --border: #e3e1dc;
    --font: "Golos Text", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { width: 375px; margin: 0; overflow-x: hidden; }
  body { background: var(--bg); color: var(--text); font: 400 16px/24px var(--font); -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }
  h1, h2, h3, p { margin: 0; }

  /* Поля 20 по бокам */
  .wrap { padding: 0 20px; }

  .header { display: flex; align-items: center; justify-content: space-between; height: 64px; padding: 0 20px; }
  .logo { font-size: 20px; line-height: 28px; font-weight: 700; }
  .header__right { display: flex; align-items: center; gap: 8px; }
  .icon-btn { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--border); }

  .hero { padding-top: 24px; }
  h1 { font-size: 36px; line-height: 40px; font-weight: 700; letter-spacing: -.01em; }
  .lead { margin-top: 16px; font-size: 16px; line-height: 24px; color: var(--text-2); }
  .btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; height: 56px; margin-top: 24px; border-radius: 12px; background: var(--accent); color: #fff; font: 500 16px/24px var(--font); }
  .micro { margin-top: 12px; font-size: 13px; line-height: 20px; color: var(--text-2); text-align: center; }
</style>
</head>
<body>
  <header class="header">
    <a class="logo" href="#">Бренд</a>
    <div class="header__right">
      <a class="icon-btn" href="#" aria-label="Позвонить">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg>
      </a>
      <a class="icon-btn" href="#" aria-label="Меню">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </a>
    </div>
  </header>

  <section class="hero wrap">
    <h1>Оффер: что, для кого и какая польза</h1>
    <p class="lead">Лид в 1–2 строки: конкретика из ТЗ.</p>
    <a class="btn" href="#">Глагол + выгода</a>
    <p class="micro">Микротекст: что будет после нажатия</p>
  </section>
</body>
</html>
