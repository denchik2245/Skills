<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>{{TITLE}} — концепция первого экрана</title>
<meta name="description" content="{{DESC}}">
<meta property="og:type" content="website">
<meta property="og:title" content="{{TITLE}} — концепция первого экрана">
<meta property="og:description" content="{{DESC}}">
<meta property="og:url" content="{{URL}}">
<meta property="og:image" content="{{OG_IMAGE}}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23f2f2f0'/%3E%3Crect x='7' y='9' width='18' height='3' rx='1.5' fill='%23141416'/%3E%3Crect x='7' y='15' width='12' height='3' rx='1.5' fill='%23141416'/%3E%3Crect x='7' y='21' width='8' height='3' rx='1.5' fill='%23ff5b2e'/%3E%3C/svg%3E">
<link rel="stylesheet" href="../viewer/viewer.css?v={{VERSION}}">
</head>
<body>
<header class="bar">
  <div class="actions">
    <a class="btn" id="dlDesktop" href="#" download title="Скачать десктоп PNG" aria-label="Скачать десктоп PNG">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>
      <span>Десктоп PNG</span>
    </a>
    <a class="btn" id="dlMobile" href="#" download title="Скачать мобильную версию PNG" aria-label="Скачать мобильную версию PNG">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg>
      <span>Мобильная PNG</span>
    </a>
    <button class="btn btn--accent" id="copy" type="button" title="Скопировать ссылку" aria-label="Скопировать ссылку">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14a4 4 0 0 0 6 0l3-3a4 4 0 0 0-6-6l-1 1m2 4a4 4 0 0 0-6 0l-3 3a4 4 0 0 0 6 6l1-1"/></svg>
      <span>Скопировать ссылку</span>
    </button>
  </div>
</header>

<main>
  <section class="stage" id="stage">
    <div class="duo">
      <figure class="frame" id="deskFrame">
        <div class="frame__chrome" aria-hidden="true">
          <i></i><i></i><i></i>
          <span class="frame__url"></span>
          <span class="frame__size" id="deskSize"></span>
        </div>
        <div class="frame__view" id="deskView"></div>
      </figure>
      <div class="phone-wrap" id="phoneWrap">
        <figure class="phone" id="phoneFrame">
          <div class="phone__screen" id="phoneView"></div>
        </figure>
        <p class="phone-hint">Мобильная версия листается</p>
      </div>
    </div>
  </section>

  <section class="why" id="why">
    <h2 class="why__title">Почему экран устроен так</h2>
    <div class="why__grid">
      <figure class="frame">
        <div class="frame__chrome" aria-hidden="true">
          <i></i><i></i><i></i>
          <span class="frame__url"></span>
        </div>
        <div class="shot" id="shot"><img id="shotImg" alt=""></div>
      </figure>
      <ol class="notes" id="notes"></ol>
    </div>
  </section>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script id="data" type="application/json">{{DATA}}</script>
<script src="../viewer/viewer.js?v={{VERSION}}"></script>
</body>
</html>
